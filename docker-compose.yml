version: '3.8'

services:
  web:
    build: .
    container_name: django_app
    command: >
      sh -c " python manage.py migrate &&
              gunicorn --bind 0.0.0.0:8000 --timeout 120 --workers 3 chistota.wsgi"
    volumes:
      - .:/app
      - /app/pages/static/pages
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      - DEBUG=False
    networks:
      - app_network

  nginx:
    image: nginx:latest
    container_name: nginx_server
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - web
    networks:
      - app_network

networks:
  app_network:

volumes:
  static_volume:
  media_volume:
