{% load static %}
<section id="faq"
         class="faq"
         {% if with_border %}style="border-top: 1px solid var(--color-gray-100);"{% endif %}>
  <div class="faq__inner">
      <h5 class="faq__header h5 gradient" >
          Частые вопросы
      </h5>
    <div class="faq__questions">
      {% for quest in questions %}
        <details class="faq__item">
          <summary class="faq__legend">{{ quest.question }}</summary>
          <p class="faq__content">{{ quest.answer }}</p>
        </details>
      {% endfor %}
    </div>
  </div>
</section>
