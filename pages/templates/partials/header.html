{% load static %}
<header class="header">
  <div class="header__body">
    <div class="header__body-inner">
      <a href="{% url 'home' %}" class="header__logo">
        <img src="{% static "pages/icons/logo.svg" %}"
             alt="Чистота"
             width="100%"
             height="100%">
      </a>
      <button class="burger-button header__burger-button" aria-label="Открыть меню">
        <span class="burger-button__line"></span>
        <span class="burger-button__line"></span>
        <span class="burger-button__line"></span>
      </button>
      <div class="header__overlay">
        <nav class="header__menu">
          <ul class="header__menu-list">
            <li class="header__menu-item">
              <a href="#about" class="header__menu-link">О компании</a>
            </li>
            <li class="header__menu-item">
              <a href="#service" class="header__menu-link">Услуги</a>
            </li>
            <li class="header__menu-item">
              <a href="#cases" class="header__menu-link">Цены</a>
            </li>
            <li class="header__menu-item">
              <a href="#faq" class="header__menu-link">Контакты</a>
            </li>
          </ul>
        </nav>
        <div class="header__contacts">
          <a href="tel:89121244221" class="header__contacts-link">+7 (912) 124 42-21</a>
          <div class="header__contacts-wrapper">
            <a href="{{ instagram_url }}"
               class="header__contacts-logo"
               target="_blank">
              <img src="{% static "pages/icons//instagram.svg" %}"
                   alt="Instagram"
                   class=""
                   width="100%"
                   height="100%">
            </a>
            <a href="{{ whatsapp_url }}"
               class="header__contacts-logo"
               target="_blank">
              <img src="{% static "pages/icons//whatsapp.svg" %}"
                   alt="WhatsApp"
                   class=""
                   width="100%"
                   height="100%">
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
