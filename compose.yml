services:
  web:
    container_name: django_app
    build: .
    entrypoint: /app/entrypoint.sh
    ports:
      - "8000:8000"
    volumes:
      - './static:/app/static'
      - './media:/app/media'
    environment:
      - DEBUG=False
    networks:
      - app_network

  nginx:
    image: nginx:latest
    container_name: nginx_server
    ports:
      - "80:80"
    volumes:
      - './db:/app/db.sqlite3'
      - './nginx.conf:/etc/nginx/nginx.conf'
      - './static:/app/static'
      - './media:/app/media'
    depends_on:
      - web
    networks:
      - app_network

networks:
  app_network: