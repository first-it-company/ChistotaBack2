services:
  web:
    container_name: django_app
    build: .
    entrypoint: /app/entrypoint.sh
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/pages/static/pages
      - static_volume:/app/static
      - media_volume:/app/media
    networks:
      - app_network

  nginx:
    image: nginx:latest
    container_name: nginx_server
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - web
    networks:
      - app_network

networks:
  app_network:

volumes:
  static_volume:
  media_volume:
